[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signal-lab"
version = "1.6.0"
description = "Explainable trading-signal research and backtesting sandbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { file = "LICENSE" }
authors = [{ name = "SergioYin" }]
keywords = ["backtesting", "trading-signals", "research", "finance", "static-demo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://sergioyin.github.io/market-signal-lab/"
Repository = "https://github.com/SergioYin/market-signal-lab"
Issues = "https://github.com/SergioYin/market-signal-lab/issues"
Documentation = "https://github.com/SergioYin/market-signal-lab/tree/main/docs"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
market-signal-lab = "market_signal_lab.cli:main"
