<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Market Signal Lab quick-tour preview</title>
  <desc id="desc">Static research-only preview showing the three-minute route from gallery to evidence, acceptance, and boundaries.</desc>
  <rect width="960" height="540" fill="#f6f8fa"/>
  <rect x="40" y="36" width="880" height="468" rx="22" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="86" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2328">Market Signal Lab: 3-minute static review</text>
  <text x="76" y="122" font-family="Arial, sans-serif" font-size="16" fill="#57606a">Synthetic sample data · no JavaScript · no broker/account/order workflow · research-only diagnostics</text>

  <g font-family="Arial, sans-serif">
    <rect x="76" y="158" width="236" height="128" rx="14" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="98" y="194" font-size="20" font-weight="700" fill="#0969da">1. Open gallery</text>
    <text x="98" y="226" font-size="15" fill="#24292f">reports/index.html</text>
    <text x="98" y="250" font-size="14" fill="#57606a">Choose single report, scenario card,</text>
    <text x="98" y="272" font-size="14" fill="#57606a">ledger, regime, or fee artifacts.</text>

    <rect x="362" y="158" width="236" height="128" rx="14" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="384" y="194" font-size="20" font-weight="700" fill="#1a7f37">2. Check evidence</text>
    <text x="384" y="226" font-size="15" fill="#24292f">docs/cold-user-evidence-card.md</text>
    <text x="384" y="250" font-size="14" fill="#57606a">Confirm source, assumptions,</text>
    <text x="384" y="272" font-size="14" fill="#57606a">metrics, caveats, and local links.</text>

    <rect x="648" y="158" width="236" height="128" rx="14" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="670" y="194" font-size="20" font-weight="700" fill="#9a6700">3. Run acceptance</text>
    <text x="670" y="226" font-size="15" fill="#24292f">python -m ... --validate-thesis-ledger</text>
    <text x="670" y="250" font-size="14" fill="#57606a">Compare PASS/WARN/FAIL outputs</text>
    <text x="670" y="272" font-size="14" fill="#57606a">with checked-in artifacts.</text>
  </g>

  <path d="M316 222 H356" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M602 222 H642" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="76" y="326" width="808" height="104" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="100" y="362" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">What this preview proves</text>
  <text x="100" y="392" font-family="Arial, sans-serif" font-size="15" fill="#57606a">A stranger can inspect the static demo path before installing anything, then reproduce one acceptance check locally.</text>
  <text x="100" y="418" font-family="Arial, sans-serif" font-size="15" fill="#57606a">All returns and diagnostics are sample backtest artifacts only; they do not predict future performance or tell anyone to trade.</text>

  <text x="76" y="472" font-family="Arial, sans-serif" font-size="13" fill="#6e7781">Public-safe static SVG. No remote assets, scripts, personal paths, or private workflow references.</text>
</svg>
