[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signal-lab"
version = "0.7.0"
description = "Explainable trading-signal research and backtesting sandbox"
requires-python = ">=3.10"
dependencies = []
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
market-signal-lab = "market_signal_lab.cli:main"
